# Default values for scythe.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/dataoneorg/scythe
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

persistence:
  enabled: true
  claimName: scythe-results
  mountPath: /var/data/scythe

cronjob:
  name: scythe
  # Hourly: each run does whatever work of the scheduled search is due and
  # possible, then exits (see ?scythe::scheduled_search and helm/README.md).
  schedule: "5 * * * *"
  # The longest a run may take before Kubernetes stops it.
  activeDeadlineHours: 23
  # A run lock older than this was left by a run that died, and is taken over.
  lockStaleHours: 24
  script: /apps/scythe/search.R
  priority:
    # Member nodes searched every cycle, in priority order, from their own
    # search indexes.
    nodes: "urn:node:ARCTIC,urn:node:ESS_DIVE,urn:node:KNB,urn:node:GOA,urn:node:SI,urn:node:CA_OPC,urn:node:SFWMD,urn:node:CERP_SFWMD,urn:node:SCTLD,urn:node:DRP,urn:node:CIB,urn:node:GERI,urn:node:FWC,urn:node:SDR"
    # DOI prefixes not searched from a node's own index: KNB's index lists
    # retired LTER and PISCO records as its own (DataONEorg/dataone#29).
    excludePrefixes: "urn:node:KNB=10.6073/AA/,10.6085/AA/"
    # Days of the month a priority cycle may start.
    cycleDays: "1,15"
  others:
    # Nodes for the citation-graph pass over the rest of DataONE: "all"
    # (every node not in priority.nodes), "none", or a comma-separated list.
    nodes: all
    exclude: ""
    # Searched after every other node.
    last: "urn:node:PANGAEA"
    everyDays: 30
  openalex:
    # Approval for OpenAlex searches: the credits one run may spend, or
    # "unlimited" to run until the searches complete or the daily budget runs
    # out (resuming on a later run). Leave empty for 500 credits a run.
    approve: ""
    # Days of lookback for the full-text search in later cycles: each looks
    # for works published since the start of the last complete cycle, less
    # this many days. See "Lookback" in helm/README.md.
    lookback: 90
    # Every this many cycles, the full-text search searches all works, to
    # catch any the lookback missed; 0 for never.
    fullTextEveryCycles: 0
  tracks:
    # Sources with a full-text track, run in parallel in each cycle.
    sources: "xdd,springer,scopus,plos"
    # The longest each track runs per hourly run, in minutes.
    minutes: 50
    # Overrides of scythe's rate-limit settings, as "name=value;..." without
    # the "scythe." prefix. The tracks adapt to each service's limits, so
    # these are only starting points, for example
    # "springer.min_interval=2;plos.failure_breaker=5;max_wait=300".
    options: ""
  metrics:
    # Hours between comparisons with DataONE's metrics service, which mark
    # each citation's in_metrics and write results/to-submit.csv; 0 for never.
    checkHours: 24
    # The service's address; empty for the package default, until
    # metrics.dataone.org's certificate covers that name
    # (DataONEorg/metrics-service#103).
    url: ""
  alerts:
    # Alert when a track's pass has spanned this many cycles.
    passCycles: 2
    # Alert when a track has been paused this many days.
    pausedDays: 3
    # Alert when the first full OpenAlex full-text pass is projected to take
    # longer than this many days.
    projectionDays: 30

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

ingress:
  enabled: false

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
