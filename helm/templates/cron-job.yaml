apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.cronjob.name }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  # Never start a run while the previous one is still going, so that runs do
  # not compete for the same OpenAlex budget.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      # Stop a run that hangs, so that later runs aren't blocked; its run lock
      # is taken over once it is cronjob.lockStaleHours old.
      activeDeadlineSeconds: {{ mul .Values.cronjob.activeDeadlineHours 3600 }}
      template:
        spec:
          containers:
            - name: {{ .Chart.Name }}
              image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
              # Optional: without a key, that source's track waits and an alert
              # is raised (see state/status.md).
              - name: springer
                valueFrom:
                  secretKeyRef:
                    name: api-keys
                    key: springer
                    optional: true
              - name: scopus
                valueFrom:
                  secretKeyRef:
                    name: api-keys
                    key: scopus
                    optional: true
              - name: openalex
                valueFrom:
                  secretKeyRef:
                    name: api-keys
                    key: openalex
                    optional: true
              - name: openalex_mailto
                valueFrom:
                  secretKeyRef:
                    name: api-keys
                    key: openalex_mailto
                    optional: true
              - name: SCYTHE_OPENALEX_APPROVE
                value: {{ .Values.cronjob.openalex.approve | quote }}
              command: ["Rscript"]
              args:
                - "--vanilla"
                - "{{ .Values.cronjob.script }}"
                - "--priority-nodes"
                - "{{ .Values.cronjob.priority.nodes }}"
                - "--exclude-prefixes"
                - "{{ .Values.cronjob.priority.excludePrefixes }}"
                - "--cycle-days"
                - "{{ .Values.cronjob.priority.cycleDays }}"
                - "--other-nodes"
                - "{{ .Values.cronjob.others.nodes }}"
                - "--exclude-nodes"
                - "{{ .Values.cronjob.others.exclude }}"
                - "--last-nodes"
                - "{{ .Values.cronjob.others.last }}"
                - "--others-every-days"
                - "{{ .Values.cronjob.others.everyDays }}"
                - "--lookback"
                - "{{ .Values.cronjob.openalex.lookback }}"
                - "--full-text-every-cycles"
                - "{{ .Values.cronjob.openalex.fullTextEveryCycles }}"
                - "--text-sources"
                - "{{ .Values.cronjob.tracks.sources }}"
                - "--track-minutes"
                - "{{ .Values.cronjob.tracks.minutes }}"
                - "--options"
                - "{{ .Values.cronjob.tracks.options }}"
                - "--metrics-check-hours"
                - "{{ .Values.cronjob.metrics.checkHours }}"
                - "--metrics-url"
                - "{{ .Values.cronjob.metrics.url }}"
                - "--alert-pass-cycles"
                - "{{ .Values.cronjob.alerts.passCycles }}"
                - "--alert-paused-days"
                - "{{ .Values.cronjob.alerts.pausedDays }}"
                - "--alert-projection-days"
                - "{{ .Values.cronjob.alerts.projectionDays }}"
                - "--lock-stale-hours"
                - "{{ .Values.cronjob.lockStaleHours }}"
                - "--dir"
                - "{{ .Values.persistence.mountPath }}"
                - "--log-dir"
                - "{{ .Values.persistence.mountPath }}/openalex-logs"

              volumeMounts:
              - name: {{ .Values.persistence.claimName }}
                mountPath: {{ .Values.persistence.mountPath }}
                readOnly: false
          volumes:
          - name: {{ .Values.persistence.claimName }}
            persistentVolumeClaim:
              claimName: {{ .Values.persistence.claimName }}
              readOnly: false
          restartPolicy: Never