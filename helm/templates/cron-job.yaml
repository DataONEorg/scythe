apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.cronjob.name }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  # Never start a run while the previous one is still going, so that runs do
  # not compete for the same OpenAlex budget.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          containers:
            - name: {{ .Chart.Name }}
              image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
              - name: springer
                valueFrom:
                  secretKeyRef:
                    name: api-keys
                    key: springer
              - name: scopus
                valueFrom:
                  secretKeyRef:
                    name: api-keys
                    key: scopus
              - name: openalex
                valueFrom:
                  secretKeyRef:
                    name: api-keys
                    key: openalex
                    optional: true
              - name: openalex_mailto
                valueFrom:
                  secretKeyRef:
                    name: api-keys
                    key: openalex_mailto
                    optional: true
              - name: SCYTHE_OPENALEX_APPROVE
                value: {{ .Values.cronjob.openalex.approve | quote }}
              command: ["Rscript"]
              args:
                - "--vanilla"
                - "{{ .Values.cronjob.script }}"
                - "--priority-nodes"
                - "{{ .Values.cronjob.priority.nodes }}"
                - "--exclude-prefixes"
                - "{{ .Values.cronjob.priority.excludePrefixes }}"
                - "--cycle-days"
                - "{{ .Values.cronjob.priority.cycleDays }}"
                - "--other-nodes"
                - "{{ .Values.cronjob.others.nodes }}"
                - "--exclude-nodes"
                - "{{ .Values.cronjob.others.exclude }}"
                - "--last-nodes"
                - "{{ .Values.cronjob.others.last }}"
                - "--others-every-days"
                - "{{ .Values.cronjob.others.everyDays }}"
                - "--lookback"
                - "{{ .Values.cronjob.openalex.lookback }}"
                - "--dir"
                - "{{ .Values.persistence.mountPath }}"
                - "--log-dir"
                - "{{ .Values.persistence.mountPath }}/openalex-logs"

              volumeMounts:
              - name: {{ .Values.persistence.claimName }}
                mountPath: {{ .Values.persistence.mountPath }}
                readOnly: false
          volumes:
          - name: {{ .Values.persistence.claimName }}
            persistentVolumeClaim:
              claimName: {{ .Values.persistence.claimName }}
              readOnly: false
          restartPolicy: Never